name: Restore and validate full Jémor Space source
on:
  push:
    paths:
      - ".github/source-transfer/part-*"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-jmor-space-source
  cancel-in-progress: true
jobs:
  restore-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify all archive parts are present
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .github/source-transfer -maxdepth 1 -type f -name 'part-*' | wc -l)"
          if [ "$count" -ne 19 ]; then
            echo "Expected 19 source parts, found $count. Upload all parts before retrying."
            exit 1
          fi
      - name: Restore and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/source-transfer/part-* | base64 --decode > "$RUNNER_TEMP/jemor-space-source.zip"
          unzip -t "$RUNNER_TEMP/jemor-space-source.zip"
          unzip -oq "$RUNNER_TEMP/jemor-space-source.zip" -d .
          rm -f "$RUNNER_TEMP/jemor-space-source.zip"
          rm -rf .github/source-transfer
      - name: Commit full source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Jémor Space source and feature expansion"
          git push
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://khgrlguwegmyzgwwnwhv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0K0D7PLvibZQqZI3uVuRCQ_uq2ajiwP
